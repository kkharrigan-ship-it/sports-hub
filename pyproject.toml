[project]
name = "sports-hub"
version = "0.1.0"
description = "Builds the Sports Hub: a shared schedule of 19 sports, refreshed twice a week."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
    "pyyaml>=6.0",
]

[project.scripts]
sports-hub = "sports_hub.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["icalendar.*"]
ignore_missing_imports = true
