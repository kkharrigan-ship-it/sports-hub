# Season file for 2026-27: hand-checked Events for Sports without a usable
# data feed, plus every Sport's off-season label.
#
# How to edit:
# - Each Sport (by its id from sports.yaml) can have:
#     returns:         short label shown when nothing is upcoming, e.g. "Returns Feb 2027"
#     offseason_note:  one sentence shown with it
#     events:          a list of entries (below)
# - Each entry needs name, date (YYYY-MM-DD, local at the venue) and source
#   (the page where the date was checked). Optional:
#     session:   e.g. "Race 1", "Final"
#     end_date:  last day of a multi-day event
#     time + tz: local start time (24-hour HH:MM) and its IANA zone, e.g. "14:00" + Europe/London.
#                Leave both out if no official time is published: the Event is then all-day.
#     location:  "City, Country"
#     tags:      e.g. [slam] for curling Grand Slams
# - Only add what's officially announced. Never guess a date.

sports:
  # Data-feed Sports: only their off-season labels live here.
  f1:
    returns: Returns in 2027
    offseason_note: The 2027 calendar hasn't been published yet.
  alpine:
    returns: Returns next winter
    offseason_note: The World Cup runs from late October to March.
  snowboard:
    returns: Returns next winter
    offseason_note: The World Cup runs from autumn to March.
  freestyle:
    returns: Returns next winter
    offseason_note: The World Cup runs from autumn to March.
  biathlon:
    returns: Returns next winter
    offseason_note: The World Cup runs from late November to March.
  pwhl:
    returns: Returns next season
    offseason_note: The regular season runs from December to April, with playoffs in May.
  swimming:
    returns: Next date TBA
    offseason_note: The next World Aquatics competition hasn't been listed yet.
  diving:
    returns: Next date TBA
    offseason_note: The next World Aquatics competition hasn't been listed yet.
  motogp:
    returns: Returns Mar 2027
    offseason_note: The 2027 season opens in Thailand in early March.
  speed-skating:
    returns: Returns next winter
    offseason_note: The World Cup runs from November to February, with the World Championships after.
  short-track:
    returns: Returns next winter
    offseason_note: The World Tour runs from October to February, with the World Championships in March.

